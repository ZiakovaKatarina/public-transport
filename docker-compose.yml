version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mhd_db
    restart: always
    environment:
      MYSQL_DATABASE: verejna_doprava
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: mhd_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=verejna_doprava
      - DB_USER=root
      - DB_PASS=password
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: